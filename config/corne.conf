CONFIG_ZMK_DISPLAY=y
# enable built-in or custom status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y   # or CUSTOM
# configure other widgets if needed:
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# RGB underglow (WS2812-compatible LEDs)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
# Keep OLED power independent of the RGB toggle.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

